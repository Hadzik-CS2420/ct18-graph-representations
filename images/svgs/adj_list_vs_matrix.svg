<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="900" height="420" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Adjacency List vs Adjacency Matrix</text>

  <!-- ===== GRAPH (center top) ===== -->
  <text x="450" y="65" text-anchor="middle" fill="#6c7086" font-size="12">Graph: A--B, A--C, B--C, B--D</text>

  <!-- Small reference graph -->
  <circle cx="390" cy="100" r="14" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="bold">A</text>
  <circle cx="450" cy="85" r="14" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="bold">B</text>
  <circle cx="510" cy="100" r="14" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="510" y="105" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="bold">C</text>
  <circle cx="450" cy="130" r="14" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="450" y="135" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="bold">D</text>

  <line x1="404" y1="100" x2="436" y2="88" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="404" y1="104" x2="496" y2="100" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="464" y1="88" x2="496" y2="97" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="450" y1="99" x2="450" y2="116" stroke="#f9e2af" stroke-width="1.5"/>

  <!-- ===== ADJACENCY LIST (left) ===== -->
  <rect x="30" y="160" width="400" height="240" rx="10" fill="#2a2a3e" stroke="#45475a" stroke-width="1"/>
  <text x="230" y="188" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">Adjacency List</text>

  <!-- Key boxes -->
  <rect x="60" y="208" width="40" height="30" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="80" y="228" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="bold">A</text>
  <text x="115" y="228" fill="#6c7086" font-size="13">--></text>
  <rect x="140" y="212" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="157" y="228" text-anchor="middle" fill="#89b4fa" font-size="11">B</text>
  <rect x="182" y="212" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="199" y="228" text-anchor="middle" fill="#89b4fa" font-size="11">C</text>

  <rect x="60" y="248" width="40" height="30" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="80" y="268" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="bold">B</text>
  <text x="115" y="268" fill="#6c7086" font-size="13">--></text>
  <rect x="140" y="252" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="157" y="268" text-anchor="middle" fill="#89b4fa" font-size="11">A</text>
  <rect x="182" y="252" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="199" y="268" text-anchor="middle" fill="#89b4fa" font-size="11">C</text>
  <rect x="224" y="252" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="241" y="268" text-anchor="middle" fill="#89b4fa" font-size="11">D</text>

  <rect x="60" y="288" width="40" height="30" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="80" y="308" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="bold">C</text>
  <text x="115" y="308" fill="#6c7086" font-size="13">--></text>
  <rect x="140" y="292" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="157" y="308" text-anchor="middle" fill="#89b4fa" font-size="11">A</text>
  <rect x="182" y="292" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="199" y="308" text-anchor="middle" fill="#89b4fa" font-size="11">B</text>

  <rect x="60" y="328" width="40" height="30" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="80" y="348" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="bold">D</text>
  <text x="115" y="348" fill="#6c7086" font-size="13">--></text>
  <rect x="140" y="332" width="35" height="22" rx="4" fill="#45475a"/>
  <text x="157" y="348" text-anchor="middle" fill="#89b4fa" font-size="11">B</text>

  <text x="230" y="385" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">Space: O(V + E)</text>
  <text x="230" y="400" text-anchor="middle" fill="#6c7086" font-size="10">Best for sparse graphs</text>

  <!-- ===== ADJACENCY MATRIX (right) ===== -->
  <rect x="470" y="160" width="400" height="240" rx="10" fill="#2a2a3e" stroke="#45475a" stroke-width="1"/>
  <text x="670" y="188" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">Adjacency Matrix</text>

  <!-- Column headers -->
  <text x="580" y="215" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">A</text>
  <text x="630" y="215" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">B</text>
  <text x="680" y="215" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">C</text>
  <text x="730" y="215" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">D</text>

  <!-- Row A -->
  <text x="540" y="245" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">A</text>
  <rect x="562" y="228" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="580" y="245" text-anchor="middle" fill="#585b70" font-size="12">0</text>
  <rect x="612" y="228" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="630" y="245" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>
  <rect x="662" y="228" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="680" y="245" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>
  <rect x="712" y="228" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="730" y="245" text-anchor="middle" fill="#585b70" font-size="12">0</text>

  <!-- Row B -->
  <text x="540" y="280" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">B</text>
  <rect x="562" y="263" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="580" y="280" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>
  <rect x="612" y="263" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="630" y="280" text-anchor="middle" fill="#585b70" font-size="12">0</text>
  <rect x="662" y="263" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="680" y="280" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>
  <rect x="712" y="263" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="730" y="280" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>

  <!-- Row C -->
  <text x="540" y="315" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">C</text>
  <rect x="562" y="298" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="580" y="315" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>
  <rect x="612" y="298" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="630" y="315" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>
  <rect x="662" y="298" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="680" y="315" text-anchor="middle" fill="#585b70" font-size="12">0</text>
  <rect x="712" y="298" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="730" y="315" text-anchor="middle" fill="#585b70" font-size="12">0</text>

  <!-- Row D -->
  <text x="540" y="350" text-anchor="middle" fill="#6c7086" font-size="12" font-weight="bold">D</text>
  <rect x="562" y="333" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="580" y="350" text-anchor="middle" fill="#585b70" font-size="12">0</text>
  <rect x="612" y="333" width="36" height="24" rx="3" fill="#313244" stroke="#89b4fa"/>
  <text x="630" y="350" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">1</text>
  <rect x="662" y="333" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="680" y="350" text-anchor="middle" fill="#585b70" font-size="12">0</text>
  <rect x="712" y="333" width="36" height="24" rx="3" fill="#313244" stroke="#45475a"/>
  <text x="730" y="350" text-anchor="middle" fill="#585b70" font-size="12">0</text>

  <text x="670" y="385" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">Space: O(V^2)</text>
  <text x="670" y="400" text-anchor="middle" fill="#6c7086" font-size="10">Fast edge lookup O(1), wasteful for sparse graphs</text>
</svg>
