<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="900" height="340" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Graph vs Tree</text>

  <!-- ===== TREE SIDE ===== -->
  <rect x="30" y="55" width="400" height="260" rx="10" fill="#2a2a3e" stroke="#45475a" stroke-width="1"/>
  <text x="230" y="82" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">Tree</text>

  <!-- Tree nodes -->
  <circle cx="230" cy="120" r="18" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="230" y="125" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">A</text>

  <circle cx="160" cy="185" r="18" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="160" y="190" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">B</text>

  <circle cx="300" cy="185" r="18" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="300" y="190" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">C</text>

  <circle cx="120" cy="250" r="18" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="120" y="255" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">D</text>

  <circle cx="200" cy="250" r="18" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="200" y="255" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">E</text>

  <!-- Tree edges -->
  <line x1="230" y1="138" x2="160" y2="167" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="230" y1="138" x2="300" y2="167" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="160" y1="203" x2="120" y2="232" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="160" y1="203" x2="200" y2="232" stroke="#a6e3a1" stroke-width="2"/>

  <!-- Tree properties -->
  <text x="230" y="298" text-anchor="middle" fill="#6c7086" font-size="11">One root, no cycles, one path between nodes</text>

  <!-- ===== GRAPH SIDE ===== -->
  <rect x="470" y="55" width="400" height="260" rx="10" fill="#2a2a3e" stroke="#45475a" stroke-width="1"/>
  <text x="670" y="82" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">Graph</text>

  <!-- Graph nodes -->
  <circle cx="600" cy="120" r="18" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">A</text>

  <circle cx="740" cy="120" r="18" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="740" y="125" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">B</text>

  <circle cx="540" cy="200" r="18" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="540" y="205" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">C</text>

  <circle cx="670" cy="210" r="18" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="670" y="215" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">D</text>

  <circle cx="800" cy="200" r="18" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="800" y="205" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">E</text>

  <!-- Graph edges (including cycle) -->
  <line x1="618" y1="120" x2="722" y2="120" stroke="#89b4fa" stroke-width="2"/>
  <line x1="590" y1="135" x2="550" y2="185" stroke="#89b4fa" stroke-width="2"/>
  <line x1="610" y1="135" x2="660" y2="195" stroke="#89b4fa" stroke-width="2"/>
  <line x1="740" y1="138" x2="800" y2="182" stroke="#89b4fa" stroke-width="2"/>
  <line x1="730" y1="135" x2="680" y2="195" stroke="#89b4fa" stroke-width="2"/>
  <line x1="558" y1="200" x2="652" y2="210" stroke="#89b4fa" stroke-width="2"/>

  <!-- Cycle highlight -->
  <text x="635" y="165" fill="#f38ba8" font-size="10" font-weight="bold">cycle!</text>
  <path d="M 605,132 C 640,160 700,160 735,132" fill="none" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Graph properties -->
  <text x="670" y="260" text-anchor="middle" fill="#6c7086" font-size="11">No root, cycles allowed, multiple paths</text>
  <text x="670" y="278" text-anchor="middle" fill="#6c7086" font-size="11">between nodes, any number of connections</text>
  <text x="670" y="298" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">A tree is a special case of a graph</text>
</svg>
